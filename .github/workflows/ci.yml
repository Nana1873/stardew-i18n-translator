name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation (versions, links, formatting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:docs

  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          non_doc_files=$(printf '%s\n' "$changed_files" \
            | grep -vE '(\.md$|^docs/|^\.github/ISSUE_TEMPLATE/)' || true)
          [[ -n "$non_doc_files" ]] && echo "code=true" >> "$GITHUB_OUTPUT" || echo "code=false" >> "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Frontend (tsc, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Rust backend (fmt, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets --profile ci -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked --profile ci
        working-directory: src-tauri

  gate:
    name: CI gate
    if: always()
    needs: [docs, changes, frontend, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          DOCS_RESULT: ${{ needs.docs.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          if [[ "$DOCS_RESULT" != "success" ]]; then
            echo "Documentation checks did not succeed: $DOCS_RESULT"
            exit 1
          fi
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection did not succeed: $CHANGES_RESULT"
            exit 1
          fi

          case "$CODE_CHANGED" in
            true)
              if [[ "$FRONTEND_RESULT" != "success" ]]; then
                echo "Frontend checks did not succeed for a code change: $FRONTEND_RESULT"
                exit 1
              fi
              if [[ "$RUST_RESULT" != "success" ]]; then
                echo "Rust checks did not succeed for a code change: $RUST_RESULT"
                exit 1
              fi
              ;;
            false)
              if [[ "$FRONTEND_RESULT" != "skipped" || "$RUST_RESULT" != "skipped" ]]; then
                echo "Code checks unexpectedly ran for a documentation-only change."
                echo "Frontend: $FRONTEND_RESULT; Rust: $RUST_RESULT"
                exit 1
              fi
              ;;
            *)
              echo "Change detection returned an invalid code flag: $CODE_CHANGED"
              exit 1
              ;;
          esac

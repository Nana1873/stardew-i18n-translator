name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature] "
labels:
  - type:enhancement
body:
  - type: markdown
    attributes:
      value: |
        Rough ideas are welcome; no technical design is needed. The app is intentionally focused on translating SMAPI i18n files rather than managing or updating mods.

  - type: textarea
    id: idea
    attributes:
      label: What would improve the app?
      description: Describe the workflow or problem and the change you have in mind.
    validations:
      required: true
